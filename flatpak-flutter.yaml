id: nl.jknaapen.fladder
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22

command: fladder

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.NetworkManager

cleanup:
  - /lib/pkgconfig
  - /lib/*.la
  - /include

modules:
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dvaapi=enabled
      - -Dcuda-hwaccel=enabled
      - -Dpulse=enabled
      - -Dalsa=enabled
      - -Duchardet=enabled
    cleanup:
      - /share
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    modules:
      - shared-modules/luajit/luajit.json
      - name: libass
        config-opts:
          - --enable-shared
          - --disable-static
        sources:
          - type: git
            url: https://github.com/libass/libass.git
            tag: 0.17.5
            commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$
      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_BINARY=OFF
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cleanup:
          - /lib/*.a
          - /share
        sources:
          - type: archive
            url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
            sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
            x-checker-data:
              type: html
              url: https://www.freedesktop.org/software/uchardet/releases/
              version-pattern: uchardet-(\d+\.\d+\.\d+)\.tar\.xz
              url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=enabled
          - -Dshaderc=enabled
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.387.0
            commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$


  - name: fladder
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/fladder/flutter/bin
      env:
        CC: clang
        CXX: clang++
        PUB_CACHE: /run/build/fladder/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - cp -a ${BUNDLE_PATH}/. /app/bin/
      - install -Dm644 flatpak/Fladder.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 icons/production/fladder_icon_512.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/DonutWare/Fladder.git
        tag: v0.12.1
        commit: 2ff4b3cafb1a5ff40a12e7b57a3ca8b3d9e44bcd

      # Use SQLite from the Flatpak runtime without downloading native assets.
      - type: patch
        path: sqlite3-system-library.patch

      # Keep native exception handling compatible with Flutter 3.50.
      - type: patch
        path: flutter-linux-unwinder.patch
      - type: patch
        path: linux-notification-launch.patch

      # Manual entries for media_kit_libs_linux (git dependency)
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/microsoft/mimalloc/archive/refs/tags/v2.1.2.tar.gz
        sha256: 2b1bff6f717f9725c70bf8d79e4786da13de8a270059e4ba0bdd262ae7be46eb
        dest: build/linux/x64/release
        dest-filename: mimalloc-2.1.2.tar.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/microsoft/mimalloc/archive/refs/tags/v2.1.2.tar.gz
        sha256: 2b1bff6f717f9725c70bf8d79e4786da13de8a270059e4ba0bdd262ae7be46eb
        dest: build/linux/arm64/release
        dest-filename: mimalloc-2.1.2.tar.gz
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.50.1
        dest: flutter
